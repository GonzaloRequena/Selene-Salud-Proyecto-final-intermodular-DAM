<div class="container-fluid d-flex justify-content-center align-items-center bg-light bg-opacity-25"
  style="min-height: 85vh;">
  <div class="position-absolute top-0 end-0 m-4">
    <div class="btn-group bg-white rounded-pill shadow-sm border p-1" role="group" aria-label="Selector de idioma">

      <button type="button"
        class="btn btn-sm rounded-pill px-3 py-1.5 d-flex align-items-center gap-1 border-0 transition-all"
        [class.btn-primary]="langService.currentLang === 'es'" [class.btn-light]="langService.currentLang !== 'es'"
        [class.text-muted]="langService.currentLang !== 'es'" (click)="langService.setLanguage('es')">
        <img src="https://flagcdn.com/w20/es.png" width="20" alt="Español" class="rounded-1 shadow-sm"> <span
          class="fw-bold small" style="font-size: 0.75rem;">ES</span>
      </button>

      <button type="button"
        class="btn btn-sm rounded-pill px-3 py-1.5 d-flex align-items-center gap-1 border-0 transition-all"
        [class.btn-primary]="langService.currentLang === 'en'" [class.btn-light]="langService.currentLang !== 'en'"
        [class.text-muted]="langService.currentLang !== 'en'" (click)="langService.setLanguage('en')">
        <img src="https://flagcdn.com/w20/gb.png" width="20" alt="English" class="rounded-1 shadow-sm"> <span
          class="fw-bold small" style="font-size: 0.75rem;">EN</span>
      </button>
    </div>
  </div>
  <div class="row w-100 justify-content-center">
    <div class="col-12 col-sm-10 col-md-6 col-lg-4">

      <div class="card shadow-sm border-0 rounded-4 overflow-hidden bg-white">
        <div class="bg-primary" style="height: 5px;"></div>

        <div class="card-body p-4 p-md-5">

          <div class="text-center mb-5">
            <h2 class="fw-bold text-primary mb-1 tracking-tight" style="font-size: 2rem;">
              <img src="logo2.png" alt="Logo Selene Salud" height="40" class="d-inline-block transition-all mb-2">
              {{ langService.get('login_title') }}<span class="fw-light text-secondary">{{
                langService.get('login_subtitle') }}</span>
            </h2>
            <span
              class="badge bg-light text-primary px-3 py-2 rounded-pill small fw-semibold mt-2 border border-primary border-opacity-10">
              {{ langService.get('login_badge') }}
            </span>
          </div>

          <form (ngSubmit)="ejecutarLogin()" autocomplete="off">

            <div class="mb-4">
              <label class="form-label text-secondary small fw-bold text-uppercase tracking-wider">
                {{ langService.get('login_email') }}
              </label>
              <div class="input-group">
                <span class="input-group-text bg-light border-0 text-muted px-3">
                  <i class="bi bi-envelope-fill"></i>
                </span>
                <input type="email" name="email"
                  class="form-control form-control-lg bg-light border-0 px-3 py-2.5 small text-dark"
                  placeholder="ejemplo.admin@selene.com" [(ngModel)]="datosFormulario.email" required
                  style="font-size: 0.95rem;">
              </div>
            </div>

            <div class="mb-5">
              <label class="form-label text-secondary small fw-bold text-uppercase tracking-wider">
                {{ langService.get('login_password') }}
              </label>
              <div class="input-group">
                <span class="input-group-text bg-light border-0 text-muted px-3">
                  <i class="bi bi-lock-fill"></i>
                </span>
                <input type="password" name="password"
                  class="form-control form-control-lg bg-light border-0 px-3 py-2.5 text-dark" placeholder="••••••••"
                  [(ngModel)]="datosFormulario.password" required style="font-size: 0.95rem;">
              </div>
            </div>

            <button type="submit"
              class="btn btn-primary btn-lg w-100 rounded-3 py-3 fw-bold shadow-sm border-0 transition-all d-flex align-items-center justify-content-center gap-2">
              <span>{{ langService.get('login_btn') }}</span>
              <i class="bi bi-arrow-right-short fs-5"></i>
            </button>

          </form>

        </div>
      </div>

      <div class="text-center mt-4">
        <p class="text-muted small">
          {{ langService.get('login_copy') }}
          <br>
          {{ langService.get('login_author') }}
        </p>
      </div>

    </div>
  </div>
</div>
