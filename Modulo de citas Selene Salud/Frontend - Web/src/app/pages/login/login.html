<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="row w-100 justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body p-5">
          
          <div class="text-center mb-4">
            <h2 class="fw-bold text-primary">Selene Salud</h2>
            <p class="text-muted">Panel de Gestión Interna Hospitalaria</p>
          </div>

          <form (ngSubmit)="ejecutarLogin()">
            
            <div class="mb-3">
              <label class="form-label fw-semibold">Correo Electrónico</label>
              <input 
                type="email" 
                name="email" 
                class="form-control form-control-lg" 
                placeholder="ejemplo.admin@selene.com"
                [(ngModel)]="datosFormulario.email" 
                required>
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold">Contraseña</label>
              <input 
                type="password" 
                name="password" 
                class="form-control form-control-lg" 
                placeholder="••••••••"
                [(ngModel)]="datosFormulario.password" 
                required>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3 shadow-sm">
              Iniciar Sesión
            </button>
            
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
